MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on'
  IF_WITH_CENTER: 'no'
  NAME: 'ViT-B-16'
  STRIDE_SIZE: [16, 16]
  ID_LOSS_WEIGHT: 0.25
  TRIPLET_LOSS_WEIGHT: 1.0
  I2T_LOSS_WEIGHT: 1.0
  # SIE_CAMERA: True
  # SIE_COE: 1.0

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  STAGE1:
    IMS_PER_BATCH: 64
    OPTIMIZER_NAME: "Adam"
    BASE_LR: 0.00035
    WARMUP_LR_INIT: 0.00001
    LR_MIN: 1e-6
    WARMUP_METHOD: 'linear'
    WEIGHT_DECAY: 1e-4
    WEIGHT_DECAY_BIAS: 1e-4
    MAX_EPOCHS: 120
    CHECKPOINT_PERIOD: 120
    LOG_PERIOD: 50
    WARMUP_EPOCHS: 5

  STAGE2:
    IMS_PER_BATCH: 64
    OPTIMIZER_NAME: "Adam"
    BASE_LR: 0.000005
    WARMUP_METHOD: 'linear'
    WARMUP_ITERS: 10
    WARMUP_FACTOR: 0.1
    WEIGHT_DECAY: 0.0001
    WEIGHT_DECAY_BIAS: 0.0001
    LARGE_FC_LR: False
    MAX_EPOCHS: 60
    CHECKPOINT_PERIOD: 60
    LOG_PERIOD: 50
    EVAL_PERIOD: 60
    BIAS_LR_FACTOR: 2
    STEPS: [30, 50]
    GAMMA: 0.1

TEST:
  EVAL: True
  IMS_PER_BATCH: 64
  RE_RANKING: False
  WEIGHT: '/workspace/DukeMTMC_clipreid_ViT-B-16_60.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

DATASETS:
  NAMES: ('dukemtmc')
  ROOT_DIR: ('/workspace/clip111/data')

OUTPUT_DIR: '/workspace/CLIP-ReID-master/logs/r2id_dukemtmc_vit_b16'

# =========================================================
# R2ID inference plug-in
# BIO -> UST-Fusion -> STG-AQE -> Final UST-Fusion
# =========================================================
R2ID:
  ENABLE: True

META:
  ST_HIST:
    ENABLE: True
    NPZ_PATH: 'npz/st_dukemtmc.npz'
    LAMBDA: 0.13
    FINAL_FUSION: True

  AQE:
    ST_GUIDED: True
    TOPK: 8
    ALPHA: 1.0
    TAU: 0.1
    RELIABILITY_SMOOTH: True
    ETA0: 0.5

BIO:
  ENHANCE:
    ENABLE: True
    TOPK: 6
    BASE_STRENGTH: 0.5
    POWER: 1.1
    TEMPERATURE: 0.05

ST:
  LAMBDA: 0.13
  UNCERTAINTY_METHOD: 'sqrt'
  RELIABILITY_MIN: 0.4
  RELIABILITY_FLOOR: 0.1
  LAMBDA_BOOST: 1.0
  SIGMOID_K: 5.0
  BLOCKWISE_CHUNK_SIZE: 128
  BLOCKWISE_DEVICES: ''